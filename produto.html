<!DOCTYPE html>
<html lang="pt-PT"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produto | PT Pulse</title><link rel="stylesheet" href="style.css">
<style>
:root{--ink:#0d1c36;--muted:#6b7280;--line:#dfe4eb;--soft:#f4f6f8;--yellow:#ffd52b;--green:#0b8a55}
body{background:#f4f6f8;color:var(--ink)}
.product-page{max-width:1240px;margin:0 auto;padding:26px 22px 80px}.back{display:inline-block;margin:0 0 18px;color:#667085;text-decoration:none;font-size:14px}.product-shell{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:start}.media-card,.info-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px rgba(10,20,40,.04)}.media-card{padding:20px}.main-photo{height:570px;border:1px solid #f0f2f5;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.main-photo img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.thumb{width:72px;height:72px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px;cursor:pointer}.thumb.active{border:2px solid #111}.thumb img{width:100%;height:100%;object-fit:contain}.info-card{padding:26px}.eyebrow{font-size:14px;color:#596579;margin:0 0 8px}.info-card h1{font-size:34px;line-height:1.1;margin:0 0 7px;color:var(--ink)}.ref{color:#667085;font-size:14px}.description{font-size:15px;line-height:1.65;color:#24324a;margin:20px 0}.stock-box{margin:18px 0;padding:11px 14px;border:1px solid #9be3bf;background:#edfff5;color:#087443;border-radius:10px;font-size:13px;font-weight:700}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.title-sm{font-size:14px;font-weight:800;margin:0 0 10px}.colors{display:flex;flex-wrap:wrap;gap:9px}.color-pill{display:flex;align-items:center;gap:8px;border:1px solid #cfd6df;background:#fff;border-radius:22px;padding:7px 12px 7px 8px;cursor:pointer;font-size:12px;font-weight:800}.color-pill.active{border:2px solid #111;padding:6px 11px 6px 7px}.color-pill img{width:26px;height:26px;object-fit:contain;border-radius:50%;border:1px solid #d2d8df;background:#fff}.color-dot{width:26px;height:26px;border-radius:50%;border:1px solid #d2d8df;display:inline-block}.quantity-grid{display:grid;grid-template-columns:1fr;gap:10px}.qty-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px}.qty-meta strong{display:block;font-size:15px}.qty-meta span{font-size:12px;color:#667085}.qty-input{width:110px;border:1px solid #cfd6df;border-radius:8px;padding:10px 12px;font-size:16px}.pers-box{margin-top:18px;border:1px solid #d8dde5;border-radius:14px;background:#f8fafc;padding:16px}.pers-box h2{font-size:17px;margin:0 0 14px}.pers-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pers-option{border:1px solid #ccd4de;border-radius:10px;background:#fff;padding:14px;text-align:center;cursor:pointer;font-weight:800}.pers-option.active{background:#111;color:#fff;border-color:#111}.pers-fields{display:none;margin-top:14px;gap:10px}.pers-fields.show{display:grid}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field select,.field textarea,.field input{width:100%;border:1px solid #cfd6df;border-radius:8px;background:#fff;padding:10px}.field textarea{min-height:82px;resize:vertical}.add-btn{width:100%;border:0;background:#111;color:#fff;border-radius:10px;padding:15px;margin-top:18px;font-size:15px;font-weight:800;cursor:pointer}.note{font-size:12px;color:#667085;margin-top:12px;line-height:1.5}
@media(max-width:900px){.product-shell{grid-template-columns:1fr}.main-photo{height:440px}.info-card{padding:20px}.product-page{padding:18px 14px 80px}}
@media(max-width:600px){.main-photo{height:330px}.info-card h1{font-size:28px}.pers-choice{grid-template-columns:1fr 1fr}.thumb{width:60px;height:60px}.color-pill{font-size:11px}}
</style></head><body>
<header class="topbar"><button class="menu-btn">☰</button><a class="brand" href="index.html"><img src="https://cdn-shopkit.com/usercontent/ptpulse/media/images/2d09747-074057-pt-pulse-autocolante.png" alt="PT Pulse"></a><div class="top-search"><input id="search" placeholder="Pesquisar produtos..."><span>⌕</span></div><div class="actions"><button onclick="location.href='index.html'">←<small>Catálogo</small></button><button onclick="openQuote()">🛒<b id="count">0</b><small>Orçamento</small></button></div></header>
<main class="product-page"><a class="back" href="index.html">← Voltar ao catálogo</a><div class="product-shell">
<section class="media-card"><div class="main-photo"><img id="mainImage" alt=""></div><div id="thumbs" class="thumbs"></div></section>
<section class="info-card"><p class="eyebrow">VESTUÁRIO</p><h1 id="name"></h1><div class="ref" id="ref"></div><p class="description" id="description"></p><div class="stock-box">● Stock: confirmação manual pela PT Pulse</div><hr class="divider">
<h2 class="title-sm">Escolher quantidade</h2><div class="title-sm" style="margin-top:14px">Cor</div><div id="colors" class="colors"></div>
<div class="title-sm" style="margin-top:18px">Quantidade</div><div id="sizes" class="quantity-grid"></div>
<div class="pers-box"><h2>Pretende personalizar este produto?</h2><div class="pers-choice"><button type="button" class="pers-option active" data-p="nao" onclick="setPers('nao')">◉ Não</button><button type="button" class="pers-option" data-p="sim" onclick="setPers('sim')">○ Sim</button></div><div id="persFields" class="pers-fields"><div class="field"><label>Tipo de personalização</label><select id="persType"><option value="estampagem">Estampagem</option><option value="outro">Outro método — confirmar</option></select></div><div class="field"><label>Localização</label><select id="position"><option>Frente</option><option>Costas</option><option>Peito esquerdo</option><option>Peito direito</option><option>Manga</option><option>Outra</option></select></div><div class="field"><label>Logótipo / ficheiro</label><input id="logo" type="file" accept="image/*,.pdf,.ai,.eps,.svg"></div><div class="field"><label>Observações</label><textarea id="persNotes" placeholder="Tamanho da estampagem, cores, texto, posição, etc."></textarea></div></div></div>
<button class="add-btn" onclick="addQuote()">Adicionar ao pedido de orçamento</button><div class="note">O preço, stock final e custo da personalização serão confirmados pela PT Pulse antes da proposta final.</div>
</section></div></main>
<script src="th-products.js"></script><script>
const params=new URLSearchParams(location.search),product=window.thProducts.find(x=>x.id===params.get('id'))||window.thProducts[0];let chosenColor=product.colors?.[0]||'',chosenSize=product.sizes?.[0]||'',pers='nao';const mainImage=document.getElementById('mainImage');
function slug(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'_').replace(/,/g,'').replace(/–/g,'-')}
function folder(name){return name==='SÃO GABRIEL'?'Sao_gabriel':name}
function pack(color){return `https://www.artigospublicitarios.com/download/2026/Packshots/${encodeURIComponent(folder(product.name))}/${encodeURIComponent(slug(color))}_f.jpg`}
function model(){return product.name==='LUANDA'?'https://www.artigospublicitarios.com/download/2026/Modelos/Luanda.jpg':product.image}
function setMain(url){mainImage.onerror=()=>{mainImage.onerror=null;mainImage.src=model()};mainImage.src=url}
function hex(c){const x=String(c).toLowerCase();const m={'branco':'#f7f7f7','preto':'#111','amarelo':'#f1d327','aqua':'#55bbc3','azul atol':'#4e7ca8','azul eclipse':'#355578','azul real':'#3a69aa','bordô':'#70283a','cinzento':'#9a9a9a','fushia':'#d86b99','laranja':'#ee7b27','limão':'#cbdc33','rosa orquídea':'#e19bb0','verde maçã':'#73a754','verde pastos':'#5b8b53','vermelho':'#bd2a34','verde floresta':'#386c49','cinza matizado':'#9d9d9d','branco matizado':'#e9e6dd','castanho':'#79523b','azul pastel':'#8eb5d5','mostarda':'#c39a2d','roxo':'#775092','salmão pastel':'#e8aa94','tropa':'#766e56','terracota':'#b36d55','cool matcha':'#a5b296','crystal blue':'#7caed5','cinza frio':'#aeb2b8','amarelo digital':'#e0c928','verde jade':'#3b9475','areia':'#cdb99b','lavanda':'#b6a6cf','alperce':'#eea064','creme':'#f0e1bf','mousse':'#c9a086','rosa velho':'#c58e93','verde abadia':'#6f8b67','verde pântano':'#4b6251'};return m[x]||'#ddd'}
function render(){document.getElementById('name').textContent=product.name;document.getElementById('ref').textContent='Ref. '+product.ref;document.getElementById('description').textContent=product.description||'Produto de vestuário para personalização.';setMain(pack(chosenColor));const cs=product.colors||[];document.getElementById('colors').innerHTML=cs.map((c,i)=>`<button type="button" class="color-pill ${i===0?'active':''}" data-color="${c.replace(/"/g,'&quot;')}" onclick="selectColor(this,'${c.replace(/'/g,"\\'")}')"><span class="color-dot" style="background:${hex(c)}"></span><span>${c}</span></button>`).join('')||'<span class="ref">Sem opções de cor.</span>';const ss=product.sizes||[];document.getElementById('sizes').innerHTML=ss.map((s,i)=>`<div class="qty-card"><div class="qty-meta"><strong>Tamanho ${s}</strong><span>Stock: confirmação manual</span></div><input class="qty-input size-input" data-size="${s}" type="number" min="0" value="0" onclick="this.select()"></div>`).join('')||'<div class="qty-card"><div class="qty-meta"><strong>Tamanho único</strong><span>Stock: confirmação manual</span></div><input id="singleQty" class="qty-input" type="number" min="0" value="0"></div>';buildThumbs()}
function buildThumbs(){const cs=product.colors||[];document.getElementById('thumbs').innerHTML=cs.map((c,i)=>`<button type="button" class="thumb ${i===0?'active':''}" title="${c}" onclick="selectThumb(this,'${c.replace(/'/g,"\\'")}')"><img src="${pack(c)}" alt="${c}" onerror="this.style.display='none';this.parentNode.querySelector('.fallback-dot').style.display='block'"><span class="fallback-dot" style="display:none;width:34px;height:34px;border-radius:50%;background:${hex(c)}"></span></button>`).join('')}
function selectColor(el,c){document.querySelectorAll('.color-pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');chosenColor=c;setMain(pack(c));document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));const t=[...document.querySelectorAll('.thumb')].find(x=>x.title===c);t?.classList.add('active')}
function selectThumb(el,c){chosenColor=c;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));el.classList.add('active');setMain(pack(c));document.querySelectorAll('.color-pill').forEach(x=>x.classList.toggle('active',x.dataset.color===c))}
function setPers(v){pers=v;document.querySelectorAll('.pers-option').forEach(x=>x.classList.toggle('active',x.dataset.p===v));document.getElementById('persFields').classList.toggle('show',v==='sim')}
function addQuote(){const items=[];document.querySelectorAll('.size-input').forEach(i=>{const q=Number(i.value)||0;if(q>0)items.push({size:i.dataset.size,qty:q})});const single=document.getElementById('singleQty');if(single&&Number(single.value)>0)items.push({size:'Único',qty:Number(single.value)});if(!items.length)return alert('Indique pelo menos uma quantidade.');const q=JSON.parse(localStorage.getItem('ptpulseQuote')||'[]');q.push({id:product.id,name:product.name,ref:product.ref,color:chosenColor,items,personalization:pers==='sim'?document.getElementById('persType').value:'sem-personalizacao',position:pers==='sim'?document.getElementById('position').value:'',fileName:pers==='sim'?(document.getElementById('logo').files[0]?.name||''):'',notes:pers==='sim'?document.getElementById('persNotes').value:'',timestamp:Date.now()});localStorage.setItem('ptpulseQuote',JSON.stringify(q));document.getElementById('count').textContent=q.length;alert('Produto adicionado ao pedido de orçamento.')}
function openQuote(){const q=JSON.parse(localStorage.getItem('ptpulseQuote')||'[]');alert(q.length?`Tem ${q.length} produto(s) no pedido.`:'Ainda não adicionou produtos.')}
render();
</script></body></html>
