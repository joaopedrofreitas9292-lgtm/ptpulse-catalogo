<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT Pulse 3D Designer</title><style>body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}header{height:58px;background:#181818;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px;padding:0 16px}.logo{font-weight:800}.logo span{color:#999;font-weight:400}button,input{font:inherit}button{background:#252525;color:#eee;border:1px solid #444;border-radius:7px;padding:8px 11px;cursor:pointer}.primary{background:#fff;color:#111}#file{display:none}.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:230px 1fr 260px}aside{background:#181818;padding:14px;border-right:1px solid #333;overflow:auto}.right{border-right:0;border-left:1px solid #333}h3{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:1px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.active{outline:2px solid #fff}.group{border-bottom:1px solid #2d2d2d;padding-bottom:15px;margin-bottom:15px}label{font-size:12px;color:#aaa;display:block;margin:8px 0 5px}input[type=number],input[type=text]{width:100%;background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:7px;box-sizing:border-box}.workspace{position:relative;background:#0d0d0d;display:flex;align-items:center;justify-content:center}canvas{background:#242424;width:min(80vw,1000px);height:min(75vh,680px);touch-action:none;box-shadow:0 15px 50px #000}.status{position:absolute;top:10px;left:10px;color:#888;font-size:12px}.hint{position:absolute;bottom:12px;background:#181818dd;border:1px solid #333;border-radius:20px;padding:7px 12px;color:#aaa;font-size:12px}.row{display:flex;gap:7px}.row>div{flex:1}.small{font-size:11px;color:#888;line-height:1.45}</style></head><body><header><div class="logo">PT PULSE <span>3D DESIGNER</span></div><button onclick="location.reload()">Novo</button><label for="file"><button onclick="file.click()">Abrir imagem</button></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button onclick="saveProject()">Guardar projeto</button><button class="primary" onclick="exportPNG()">Exportar PNG</button></header><div class="layout"><aside><div class="group"><h3>Ferramentas</h3><div class="tools"><button class="active" data-tool="pen">Caneta</button><button data-tool="line">Linha</button><button data-tool="rect">Retângulo</button><button data-tool="circle">Círculo</button><button data-tool="poly">Polígono</button></div></div><div class="group"><h3>Imagem</h3><button onclick="fitImage()">Ajustar ao painel</button><label>Opacidade</label><input id="opacity" type="range" min="0" max="100" value="55"></div><div class="group"><h3>Traço</h3><label>Espessura</label><input id="stroke" type="number" value="3" min="1" max="50"><label>Cor</label><input id="strokeColor" type="text" value="#ffffff"></div><div class="group"><h3>Edição</h3><button onclick="undo()">↶ Desfazer</button> <button onclick="redo()">↷ Refazer</button><button onclick="clearDraw()">Apagar</button></div></aside><main class="workspace"><canvas id="canvas" width="1400" height="900"></canvas><div id="status" class="status">Sem imagem — carregue uma referência</div><div class="hint">Desenhe o eixo central do traço</div></main><aside class="right"><div class="group"><h3>Medidas</h3><div class="row"><div><label>Largura mm</label><input id="mmW" type="number" value="1000"></div><div><label>Altura mm</label><input id="mmH" type="number" value="700"></div></div></div><div class="group"><h3>Objetos</h3><div id="objects" class="small">Nenhum objeto.</div></div><div class="group"><h3>3D</h3><button class="primary" onclick="preview3d()">Abrir pré-visualização 3D</button><p class="small">Módulo 3D será acrescentado na próxima versão.</p></div></aside></div><script>const c=document.getElementById('canvas'),ctx=c.getContext('2d');let bg=null,opacity=.55,tool='pen',down=false,start=null,cur=null,objects=[],hist=[],future=[];const $=id=>document.getElementById(id);function snap(){hist.push(JSON.stringify(objects));future=[]}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function draw(o){ctx.save();ctx.strokeStyle=o.color||'#fff';ctx.lineWidth=o.width||3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();if(o.type==='line'){ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2)}if(o.type==='rect')ctx.rect(o.x,o.y,o.w,o.h);if(o.type==='circle')ctx.arc(o.cx,o.cy,o.r,0,Math.PI*2);if(o.type==='path')o.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(o.type==='poly'){o.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}ctx.stroke();ctx.restore()}function redraw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#242424';ctx.fillRect(0,0,c.width,c.height);if(bg){ctx.globalAlpha=opacity;let s=Math.min(c.width/bg.width,c.height/bg.height),w=bg.width*s,h=bg.height*s;ctx.drawImage(bg,(c.width-w)/2,(c.height-h)/2,w,h);ctx.globalAlpha=1}objects.forEach(draw);if(down&&start&&cur&&tool!=='pen'){let p=cur;ctx.save();ctx.strokeStyle=$('strokeColor').value;ctx.lineWidth=+$('stroke').value;ctx.beginPath();if(tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}else if(tool==='rect')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);else if(tool==='circle')ctx.arc(start.x,start.y,Math.hypot(p.x-start.x,p.y-start.y),0,Math.PI*2);ctx.stroke();ctx.restore()}$('objects').innerHTML=objects.length?objects.map((o,i)=>(i+1)+'. '+o.type).join('<br>'):'Nenhum objeto.'}c.onpointerdown=e=>{start=cur=pos(e);down=true;if(tool==='pen'){snap();objects.push({type:'path',pts:[start],color:$('strokeColor').value,width:+$('stroke').value})}};c.onpointermove=e=>{if(!down)return;cur=pos(e);if(tool==='pen')objects.at(-1).pts.push(cur);redraw()};c.onpointerup=e=>{if(!down)return;let p=pos(e);down=false;if(tool==='line')objects.push({type:'line',x1:start.x,y1:start.y,x2:p.x,y2:p.y,color:$('strokeColor').value,width:+$('stroke').value});if(tool==='rect')objects.push({type:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y,color:$('strokeColor').value,width:+$('stroke').value});if(tool==='circle')objects.push({type:'circle',cx:start.x,cy:start.y,r:Math.hypot(p.x-start.x,p.y-start.y),color:$('strokeColor').value,width:+$('stroke').value});redraw()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('opacity').oninput=e=>{opacity=e.target.value/100;redraw()};$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{bg=im;$('status').textContent=f.name;redraw()};im.src=URL.createObjectURL(f)};function undo(){if(hist.length){future.push(JSON.stringify(objects));objects=JSON.parse(hist.pop());redraw()}}function redo(){if(future.length){hist.push(JSON.stringify(objects));objects=JSON.parse(future.pop());redraw()}}function clearDraw(){if(objects.length){snap();objects=[];redraw()}}function fitImage(){redraw()}function saveProject(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,mmW:+$('mmW').value,mmH:+$('mmH').value,objects},null,2)],{type:'application/json'}));a.download='pt-pulse-projeto.json';a.click()}function exportPNG(){let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='pt-pulse-desenho.png';a.click()}function preview3d(){alert('Pré-visualização 3D — módulo em desenvolvimento.')}redraw();</script></body></html>
